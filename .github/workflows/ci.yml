name: Backend Automated Guardrails & CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  security-guardrails:
    name: Automated Security Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection Guardrail
        run: |
          echo "Scanning repository for high-entropy tokens and leaked secrets..."
          # Reject committed production secrets and private keys
          if grep -rnEI 'BEGIN (RSA|EC|DSA|OPENSSH) PRIVATE KEY' src/ 2>/dev/null; then
            echo "::error::Private cryptographic key found committed in repository!"
            exit 1
          fi
          echo "Security Guardrail PASSED: Zero private keys detected."

  test-and-build:
    name: Build, Test & Quality Verification
    needs: [ security-guardrails ]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stark_vms_db
          POSTGRES_USER: vms_user
          POSTGRES_PASSWORD: vms_secure_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Verify Gradle Dependencies & Build Hygiene
        run: ./gradlew dependencies --configuration compileClasspath > /dev/null

      - name: Execute Test Suite with PostgreSQL Container
        env:
          DB_URL: jdbc:postgresql://localhost:5432/stark_vms_db
          DB_USERNAME: vms_user
          DB_PASSWORD: vms_secure_ci_password
          JWT_SECRET: stark-group-vms-assignment-2-secret-key-32-chars-long
          CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
        run: |
          echo "Running Full Test-Driven Quality Suite (Unit + Integration + NFR)..."
          ./gradlew test --no-daemon

      - name: Assemble Spring Boot Production JAR
        run: ./gradlew bootJar --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: build/libs/*.jar
          retention-days: 7
