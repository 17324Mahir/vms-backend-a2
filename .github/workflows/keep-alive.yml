name: Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (sleep threshold is 15 minutes)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    name: Ping Actuator Health
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive HTTP request
        run: |
          echo "Sending keep-alive ping to Render backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://vms-backend-i7bt.onrender.com/actuator/health)
          echo "Backend returned HTTP $HTTP_STATUS at $(date -u)"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "SUCCESS: Backend is active and awake."
          else
            echo "WARNING: Backend returned status $HTTP_STATUS"
          fi

