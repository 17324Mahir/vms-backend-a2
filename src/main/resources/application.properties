spring.application.name=stark-vms-backend

# Server Configuration (Render supplies runtime PORT)
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=native

# Externalized Database Connectivity Settings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Schema Management & Validation
# Flyway manages explicit migrations; Hibernate validates schema on startup
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# CORS Configuration for Frontend Integration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Security & JWT Configuration
# JWT_SECRET must be at least 32 characters (256 bits) for HMAC-SHA256
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
app.security.jwt.issuer=${JWT_ISSUER:stark-vms-backend}
app.security.jwt.audience=${JWT_AUDIENCE:stark-vms-frontend}

# Spring Boot Actuator Health Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.health.db.enabled=true
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*

# Proactive Keep-Alive Configuration
# Prevents free container spin-down by self-pinging target public URL every 7 minutes
app.keep-alive.enabled=${APP_KEEP_ALIVE_ENABLED:true}
app.keep-alive.target-url=${APP_KEEP_ALIVE_TARGET_URL:https://vms-backend-a2.onrender.com/actuator/health}
app.keep-alive.interval-ms=${APP_KEEP_ALIVE_INTERVAL_MS:420000}
app.keep-alive.initial-delay-ms=${APP_KEEP_ALIVE_INITIAL_DELAY_MS:30000}

